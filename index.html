<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Cours</title>
    <style>
        body {
            font-family: Georgia, -serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        
        .course-section {
            margin: 30px 0;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        
        .course-section h2 {
            color: #2980b9;
            margin-top: 0;
        }
        
        .pdf-list {
            list-style: none;
            padding: 0;
        }
        
        .pdf-list li {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .pdf-list a {
            text-decoration: none;
            color: #2980b9;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        
        .pdf-list a:hover {
            color: #3498db;
        }
        
        .pdf-icon {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .date {
            font-size: 0.9em;
            color: #666;
            float: right;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            border-top: 1px solid #ddd;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>📚 Mes Cours</h1>
    
    <!-- Remplacez les sections ci-dessous par vos propres matières -->
    
    <div class="course-section">
        <h2>Philosophie</h2>
        <ul class="pdf-list">
            <li>
                <a href="pdfs/maths/cours1.pdf" target="_blank">
                    <span class="pdf-icon">📄</span>
                    Chapitre 1 : Algèbre linéaire
                </a>
                <span class="date">15/01/2025</span>
            </li>
            <li>
                <a href="pdfs/maths/cours2.pdf" target="_blank">
                    <span class="pdf-icon">📄</span>
                    Chapitre 2 : Calcul différentiel
                </a>
                <span class="date">22/01/2025</span>
            </li>
        </ul>
    </div>
    
    <div class="course-section">
        <h2>Physique</h2>
        <ul class="pdf-list">
            <li>
                <a href="pdfs/physique/cours1.pdf" target="_blank">
                    <span class="pdf-icon">📄</span>
                    Introduction à la mécanique quantique
                </a>
                <span class="date">18/01/2025</span>
            </li>
        </ul>
    </div>
    
    <!-- Ajoutez d'autres sections selon vos matières -->
    
    <footer>
        <p>Site mis à jour régulièrement avec les nouveaux cours</p>
    </footer>
</body>
</html>
